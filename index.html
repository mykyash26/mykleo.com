<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>Relay — Unified Inbox</title>
  <style>
    :root{--bg:#090d18;--panel:#0f1524;--panel2:#121a2c;--line:rgba(255,255,255,.08);--text:#eef3ff;--muted:#8c97ad;--accent:#7c6cff;--accent2:#58d8ff;--green:#4dd49b;--danger:#ff6d86;--shadow:0 24px 70px rgba(0,0,0,.34)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0%,#18213c 0,#090d18 38%,#070a12 100%);color:var(--text)}
    button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:260px 370px 1fr;min-height:100vh;max-width:1600px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line);background:rgba(8,12,22,.78);backdrop-filter:blur(20px)}
    .sidebar{padding:22px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:5px 9px;font-weight:800;letter-spacing:-.03em;font-size:21px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 8px 25px rgba(124,108,255,.35)}.logo svg{width:18px}.workspace{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:13px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.workspace small{display:block;color:var(--muted);font-size:10px;margin-bottom:2px}.workspace b{font-size:12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#9aa5bb;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:12px;transition:.2s}.nav button:hover,.nav button.active{background:rgba(255,255,255,.065);color:#fff}.nav svg{width:18px}.count{margin-left:auto;font-size:11px;color:#bfc8da;background:#1a2234;padding:3px 7px;border-radius:20px}.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#66718a;padding:0 12px}.channels{display:grid;gap:7px}.channel{display:flex;align-items:center;gap:9px;padding:7px 12px;color:#aeb8ca;font-size:12px}.dot{width:8px;height:8px;border-radius:50%}.gmail{background:#f05b65}.slack{background:#5ce0a1}.discord{background:#7289da}.outlook{background:#4da7ff}.user-card{margin-top:auto;border-top:1px solid var(--line);padding:15px 8px 2px;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,#293a66,#795fc8)}.user-card small{color:var(--muted);font-size:11px}.user-card button{margin-left:auto;background:none;border:0;color:#69748b}
    .inbox{border-right:1px solid var(--line);min-width:0}.inbox-head{padding:22px 20px 14px}.eyebrow{color:#7d88a1;text-transform:uppercase;font-size:10px;letter-spacing:.14em}.title-row{display:flex;justify-content:space-between;align-items:center;margin:7px 0 15px}.title-row h1{margin:0;font-size:23px;letter-spacing:-.04em}.compose{border:0;color:#fff;background:var(--accent);padding:9px 12px;border-radius:9px;font-weight:700;font-size:12px;box-shadow:0 8px 20px rgba(124,108,255,.25);transition:.2s}.compose:hover{transform:translateY(-1px);filter:brightness(1.08)}.search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#0b1120;border-radius:10px;padding:9px 11px;color:#647088}.search input{width:100%;border:0;outline:0;background:none;color:#fff;font-size:12px}.filters{display:flex;gap:7px;margin-top:12px}.filter{border:1px solid var(--line);background:transparent;color:#8f9ab0;padding:6px 9px;border-radius:20px;font-size:10px}.filter.active{background:#1a2032;color:#fff}.messages{padding:5px 9px}.message{padding:13px 11px;border-radius:13px;margin:2px 0;display:grid;grid-template-columns:36px 1fr;gap:10px;transition:.18s;position:relative}.message:hover{background:rgba(255,255,255,.045)}.message.active{background:linear-gradient(100deg,rgba(124,108,255,.15),rgba(124,108,255,.04));box-shadow:inset 2px 0 var(--accent)}.message .avatar{width:36px;height:36px}.meta{display:flex;align-items:center;gap:7px;min-width:0}.meta b{font-size:12px}.time{margin-left:auto;color:#68738a;font-size:10px}.preview{display:flex;align-items:center;gap:6px;margin-top:4px}.preview b{font-size:11px;color:#cbd3e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview span{font-size:11px;color:#778298;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.source{display:inline-flex;align-items:center;gap:4px;color:#6f7b91;font-size:9px;margin-top:6px}.unread{width:6px;height:6px;border-radius:50%;background:var(--accent2);position:absolute;right:10px;top:17px}
    .chat{min-width:0;display:flex;flex-direction:column;position:relative;background:linear-gradient(180deg,rgba(18,25,43,.35),rgba(8,12,22,.1))}.chat-head{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 25px;gap:12px}.chat-head .avatar{width:40px;height:40px}.chat-name{font-weight:750;font-size:13px}.status{font-size:10px;color:var(--green);margin-top:3px}.head-actions{margin-left:auto;display:flex;gap:5px}.icon-btn{width:33px;height:33px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.025);color:#8994aa;display:grid;place-items:center;transition:.2s}.icon-btn:hover{color:#fff;background:rgba(255,255,255,.07)}.conversation{flex:1;overflow:auto;padding:28px 8%;display:flex;flex-direction:column;gap:18px}.date{text-align:center;color:#5f6b83;font-size:10px;margin:3px 0}.row{display:flex;gap:9px;max-width:74%;animation:rise .3s ease}.row.me{align-self:flex-end;flex-direction:row-reverse}.bubble{padding:10px 13px;border-radius:14px;background:#141c2e;border:1px solid var(--line);font-size:12px;line-height:1.55;color:#dce3f0;box-shadow:0 6px 18px rgba(0,0,0,.12)}.me .bubble{background:linear-gradient(135deg,#6858dd,#7b6ced);border-color:transparent;color:#fff;border-bottom-right-radius:4px}.row:not(.me) .bubble{border-bottom-left-radius:4px}.row .avatar{width:26px;height:26px;flex:0 0 auto;font-size:9px}.bubble .attachment{margin-top:8px;padding:8px;background:rgba(255,255,255,.06);border-radius:9px;font-size:10px;color:#b9c4d7}.composer{padding:15px 7%;border-top:1px solid var(--line);background:rgba(8,12,22,.7)}.typing{display:none;font-size:10px;color:#718097;margin:0 0 7px 4px}.composer-box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);background:#0c1220;border-radius:13px;padding:8px}.composer textarea{resize:none;outline:0;border:0;background:none;color:#fff;width:100%;min-height:38px;max-height:100px;padding:8px;font-size:12px}.send{width:38px;height:38px;border:0;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;transition:.2s}.send:hover{transform:translateY(-1px)}
    .toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#161f33;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:11px;box-shadow:var(--shadow);pointer-events:none;transition:.25s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    @media(max-width:1000px){.app{grid-template-columns:74px 330px 1fr}.sidebar{padding:20px 10px}.brand span,.workspace,.nav span,.count,.section-label,.channels,.user-card div{display:none}.brand{justify-content:center}.nav button{justify-content:center}.user-card{justify-content:center}.user-card button{display:none}.conversation{padding-left:5%;padding-right:5%}}
    @media(max-width:720px){.app{display:block}.sidebar{display:none}.inbox{display:block;height:100vh}.chat{position:fixed;inset:0;background:var(--bg);z-index:10;transform:translateX(100%);transition:.3s}.chat.open{transform:none}.mobile-back{display:grid!important}.inbox{height:100vh}.conversation{padding:22px 18px}.composer{padding:12px 18px}.mobile-back{width:32px;height:32px;border:1px solid var(--line);background:transparent;color:#aaa;border-radius:9px;place-items:center;margin-right:2px}}
    .mobile-back{display:none}
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M4 7.5A3.5 3.5 0 0 1 7.5 4h9A3.5 3.5 0 0 1 20 7.5v6a3.5 3.5 0 0 1-3.5 3.5H12l-4.5 3v-3H7.5A3.5 3.5 0 0 1 4 13.5z"/></svg></div><span>Relay</span></div>
      <div class="workspace"><div><small>WORKSPACE</small><b>Personal</b></div><span>⌄</span></div>
      <div class="section-label">Inbox</div>
      <nav class="nav">
        <button class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v14H4z"/><path d="m4 7 8 6 8-6"/></svg><span>All messages</span><em class="count">12</em></button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Unread</span><em class="count">4</em></button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5h14v14H5z"/><path d="M8 8h8M8 12h6"/></svg><span>Mentions</span></button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M3 12h18"/></svg><span>New</span></button>
      </nav>
      <div class="section-label">Connected apps</div>
      <div class="channels"><div class="channel"><i class="dot gmail"></i>Gmail</div><div class="channel"><i class="dot outlook"></i>Outlook</div><div class="channel"><i class="dot slack"></i>Slack</div><div class="channel"><i class="dot discord"></i>Discord</div></div>
      <div class="user-card"><div class="avatar">MK</div><div><b style="font-size:11px">Mykleo</b><small>Available</small></div><button>•••</button></div>
    </aside>

    <section class="inbox">
      <header class="inbox-head"><div class="eyebrow">Unified inbox</div><div class="title-row"><h1>Messages</h1><button class="compose" id="composeBtn">+ Compose</button></div><label class="search"><svg width="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" placeholder="Search messages, people..." /></label><div class="filters"><button class="filter active">All</button><button class="filter">Unread</button><button class="filter">Email</button><button class="filter">Chat</button></div></header>
      <div class="messages" id="messages"></div>
    </section>

    <section class="chat" id="chat">
      <header class="chat-head"><button class="mobile-back" id="backBtn">←</button><div class="avatar" id="chatAvatar">AC</div><div><div class="chat-name" id="chatName">Alex Chen</div><div class="status">● Online</div></div><div class="head-actions"><button class="icon-btn">⌕</button><button class="icon-btn">☆</button><button class="icon-btn">•••</button></div></header>
      <div class="conversation" id="conversation"></div>
      <div class="composer"><div class="typing" id="typing">Alex is typing…</div><div class="composer-box"><button class="icon-btn">＋</button><textarea id="reply" rows="1" placeholder="Write a reply…"></textarea><button class="send" id="send">➤</button></div></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    const people=[
      {id:'alex',name:'Alex Chen',initials:'AC',source:'Slack',dot:'slack',subject:'The launch looks great',preview:'One tiny thing before we ship — can you...',time:'2m',unread:true,color:'linear-gradient(135deg,#244c67,#3e9cc5)',messages:[['them','Hey! I just reviewed the new launch flow.','10:31 AM'],['me','Nice — anything you want me to tweak?','10:33 AM'],['them','The launch looks great. One tiny thing before we ship — can you make the empty state a little clearer?','10:34 AM'],['me','Yep, I’ll clean that up now.','10:35 AM']]},
      {id:'maya',name:'Maya Patel',initials:'MP',source:'Gmail',dot:'gmail',subject:'Re: Project Atlas',preview:'I dropped the latest notes in the thread.',time:'18m',unread:true,color:'linear-gradient(135deg,#754f68,#d184a1)',messages:[['them','Hi! I dropped the latest notes in the thread.','10:14 AM'],['me','Got them, thank you. I’ll take a look this afternoon.','10:16 AM'],['them','Perfect. Let me know if anything is unclear.','10:17 AM']]},
      {id:'noah',name:'Noah Williams',initials:'NW',source:'Discord',dot:'discord',subject:'Quick question',preview:'Are we still on for the demo tomorrow?',time:'42m',color:'linear-gradient(135deg,#40406e,#7474d2)',messages:[['them','Quick question — are we still on for the demo tomorrow?','9:50 AM'],['me','Absolutely. Same time as planned.','9:53 AM']]},
      {id:'sarah',name:'Sarah Kim',initials:'SK',source:'Outlook',dot:'outlook',subject:'Design review',preview:'Attached the revised screens for review.',time:'1h',unread:true,color:'linear-gradient(135deg,#6b5337,#c99d62)',messages:[['them','Attached the revised screens for review.','9:12 AM'],['me','Thanks Sarah. I’ll leave comments in the file.','9:20 AM']]},
      {id:'liam',name:'Liam Torres',initials:'LT',source:'Gmail',dot:'gmail',subject:'Coffee next week?',preview:'Free Tuesday afternoon?',time:'2h',color:'linear-gradient(135deg,#315f50,#61b091)',messages:[['them','Free Tuesday afternoon?','8:05 AM'],['me','Tuesday works!','8:07 AM']]},
      {id:'nina',name:'Nina Park',initials:'NP',source:'Slack',dot:'slack',subject:'Shipped 🎉',preview:'The new notifications are live.',time:'3h',color:'linear-gradient(135deg,#594b76,#9b80d1)',messages:[['them','Shipped 🎉 The new notifications are live.','7:22 AM'],['me','Amazing work!','7:24 AM']]}
    ];
    let selected=people[0];
    const list=document.getElementById('messages'), conversation=document.getElementById('conversation');
    function renderList(filter=''){
      const q=filter.toLowerCase(); list.innerHTML='';
      people.filter(p=>(p.name+p.subject+p.preview+p.source).toLowerCase().includes(q)).forEach(p=>{
        const el=document.createElement('button'); el.className='message '+(p.id===selected.id?'active':''); el.dataset.id=p.id; el.innerHTML=`<div class="avatar" style="background:${p.color}">${p.initials}</div><div><div class="meta"><b>${p.name}</b><span class="time">${p.time}</span></div><div class="preview"><b>${p.subject}</b><span>· ${p.preview}</span></div><div class="source"><i class="dot ${p.dot}"></i>${p.source}</div></div>${p.unread?'<i class="unread"></i>':''}`; el.onclick=()=>select(p); list.appendChild(el);
      });
    }
    function select(p){selected=p;document.getElementById('chatName').textContent=p.name;document.getElementById('chatAvatar').textContent=p.initials;document.getElementById('chatAvatar').style.background=p.color;renderConversation();renderList(document.getElementById('search').value);document.getElementById('chat').classList.add('open');}
    function renderConversation(){conversation.innerHTML='<div class="date">Today</div>';selected.messages.forEach(m=>{const row=document.createElement('div');row.className='row '+(m[0]==='me'?'me':'');row.innerHTML=`<div class="avatar" style="background:${m[0]==='me'?'linear-gradient(135deg,#293a66,#795fc8)':selected.color}">${m[0]==='me'?'MK':selected.initials}</div><div><div class="bubble">${escapeHtml(m[1])}</div><div style="font-size:9px;color:#58647b;margin-top:5px;${m[0]==='me'?'text-align:right':''}">${m[2]}</div></div>`;conversation.appendChild(row)});conversation.scrollTop=conversation.scrollHeight;}
    function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
    function send(){const input=document.getElementById('reply'),text=input.value.trim();if(!text)return;selected.messages.push(['me',text,new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})]);input.value='';renderConversation();showToast('Reply sent');setTimeout(()=>{document.getElementById('typing').style.display='block';setTimeout(()=>document.getElementById('typing').style.display='none',900)},500);}
    function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
    document.getElementById('send').onclick=send;document.getElementById('reply').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.getElementById('search').oninput=e=>renderList(e.target.value);document.getElementById('backBtn').onclick=()=>document.getElementById('chat').classList.remove('open');document.getElementById('composeBtn').onclick=()=>showToast('New message composer ready');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');showToast(b.textContent+' view')});
    renderList();renderConversation();
  </script>
</body>
</html>
